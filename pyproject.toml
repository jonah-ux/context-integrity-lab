[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-integrity-lab"
version = "0.2.0"
description = "A deterministic provenance and freshness gate for synthetic AI context"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonah Helland" }]
dependencies = []

[project.scripts]
context-integrity = "context_integrity:main"
context-integrity-demo = "web_app:main"

[tool.setuptools]
py-modules = ["context_integrity", "web_app"]

[tool.setuptools.packages.find]
include = ["context_integrity_lab", "context_integrity_lab.*"]
namespaces = false

[tool.setuptools.package-data]
context_integrity_lab = ["fixtures/*.json", "static/*.js", "static/*.html", "static/*.css"]
